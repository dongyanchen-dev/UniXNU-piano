name: package
on:
  push:
    branches: [fix/owner-root-lock-diagnostics]
  workflow_dispatch:
    inputs:
      os:
        type: choice
        options: ["17", "26", "27"]
        default: "17"
      jobs:
        default: "4"
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 300
    env:
      UNIXNU_UNIQUE_CHIP_ID: "0x0123456789abcdef"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: IssacL04/UniXNU_Enc3l
          # The SM8750/Pagani catalog carries the five local driver identities selected by board.toml; official UniXNU components.toml does not.
          ref: a6ff7768bba6b9f285ac4c3e5b2c5d4904a016a3
          path: UniXNU
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: xiaomi-pad-8-pro-development/android_device_xiaomi_piano-uefi
          # Pinned 2026-11-09: unixnu branch head. Replace when the UEFI source changes.
          ref: 31545f9392d5f5c2acae14cec2fa3a0aa1de51d4
          path: uefi
          submodules: recursive
      # ipsw fetch range-reads only the members it needs and skips any that are
      # already extracted with the right size and pin (unixnu/ipsw.py extract()),
      # so the cache turns the eleven-minute download into a copy. Bump v1 when
      # board.toml [ipsw] changes version, build or sha256 pins.
      # ipsw fetch range-reads only the members it needs and skips any that are
      # already extracted with the right size and pin (unixnu/ipsw.py extract()),
      # so the cache turns an eleven-minute fetch into a copy.
      - name: ipsw cache
        uses: actions/cache@v4
        with:
          path: UniXNU/out/ipsw
          key: ipsw-21H461-v2
          restore-keys: |
            ipsw-21H461-
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools openssl@3 blacktop/tap/ipsw
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/lld/bin" >> $GITHUB_PATH
      - name: prep
        run: |
          (cd uefi && chmod +x tools/setup-deps.sh && ./tools/setup-deps.sh) || echo "setup-deps skipped"
          # The repository records these as submodules for local development;
          # the GitHub commit also works when a connector-created branch cannot
          # carry a gitlink, so materialise the exact pinned driver checkouts.
          if [ ! -e device/modules/Piano/.git ]; then
            git clone --depth 1 https://github.com/xiaomi-pad-8-pro-development/UniXNU-Piano-Drivers.git device/modules/Piano
            git -C device/modules/Piano fetch --depth 1 origin c0726fb8d7dd60acda40a111e3a4a7f85b3c0a58
            git -C device/modules/Piano checkout --detach c0726fb8d7dd60acda40a111e3a4a7f85b3c0a58
          fi
          if [ ! -e device/modules/ArmSmmu4K/.git ]; then
            git clone --depth 1 https://github.com/UniXNU/ArmSmmu4K.git device/modules/ArmSmmu4K
            git -C device/modules/ArmSmmu4K fetch --depth 1 origin e923329e74f18b11e63c155e470c970ebad3b6e2
            git -C device/modules/ArmSmmu4K checkout --detach e923329e74f18b11e63c155e470c970ebad3b6e2
          fi
          git apply device/patches/uefi/piano-dsc-unixnulib.patch
          # The vendor DisplayDxe panics the firmware (black frame, then a
          # reboot into Android), so stay on ScaledFbDxe and make it publish a
          # second, linear GOP over the panel buffer that DarwinBoot can hand to
          # XNU. The scaled BltOnly instance stays for ConOut.
          git apply device/patches/uefi/piano-scaledfb-linear-gop.patch
          grep -n 'linear GOP base' uefi/uefi/pianoPkg/Drivers/ScaledFbDxe/ScaledFb.c
          # A vendor ABL refuses the 160 MiB payload ramdisk, so the payload
          # arrives over USB instead: this raises the download cap, publishes
          # the staged bytes as a block device and holds the boot menu back
          # until they arrive. It also keeps the fastboot bring-up trace.
          git apply device/patches/uefi/piano-fastboot-payload.patch
          # The kernel leaves a post-mortem page before each UFS step; the next boot
          # reports it, because a fatal register write can reset before the panic draws.
          git apply device/patches/uefi/piano-death-log.patch
          grep -n 'ReportPreviousDeath' uefi/uefi/pianoPkg/Library/DeviceBootManagerLib/PianoFastboot.c
          # Report the UFS controller while UEFI is still driving it, right after
          # payload.img was read through it. Every measurement so far came from
          # the post-ExitBootServices state; this is the same controller moments
          # earlier, so the two can be compared field by field. Nothing is
          # written.
          git apply device/patches/uefi/piano-smmu-ufs-bypass.patch
          grep -n 'PianoUfsDump' uefi/uefi/pianoPkg/Library/DeviceBootManagerLib/DeviceBootManager.c
          # StartEx reports success and the host still never sees the device,
          # so retry the device role while no connected event arrives.
          python3 device/scripts/prepare-piano-fastboot-usb-retry.py uefi
          grep -n 'mHostConnected' uefi/uefi/pianoPkg/Library/DeviceBootManagerLib/PianoFastboot.c
          # Two-second metronome stalls block the USB driver's event handler,
          # so the host times out during enumeration and never retries.
          python3 device/scripts/prepare-piano-fastboot-usb-timing.py uefi
          # The payload can also live in the ipados partition, so a firmware
          # whose USB never comes up still boots the kernel.
          python3 device/scripts/prepare-piano-payload-storage.py uefi
          # StartEx leaves DCTL.RUN_STOP clear, so run the controller ourselves.
          grep -n 'oem ramdisk' uefi/uefi/pianoPkg/Library/DeviceBootManagerLib/PianoFastboot.c
          grep -n 'SIZE_256MB' uefi/uefi/pianoPkg/Library/DeviceBootManagerLib/PianoFastboot.c
          # Upstream BootShim.S writes FD_SIZE alone into the ARM64 image_size
          # field; UniXNU bootimg needs the whole image (shim + volume) and
          # rejects it otherwise. Patch the fetched Mu-Silicium checkout.
          git -C uefi/deps/Mu-Silicium apply "$PWD/device/patches/uefi/bootshim-image-size.patch"
          grep -n '_Payload - _Head' uefi/deps/Mu-Silicium/BootShim/BootShim.S
          # Mu-Silicium's SEC drops the device tree pointer the firmware passes
          # in x0; UniXNURamDiskDxe needs it in a HOB to publish the payload.
          git -C uefi/deps/Mu-Silicium apply "$PWD/device/patches/uefi/mu-sec-entry-arg.patch"
          grep -n 'mEntryArg = Dtb' uefi/deps/Mu-Silicium/Silicon/Silicium/SiliciumPkg/Sec/Sec.c
          # Mu-Silicium's BootShim writes FD_BASE into the ARM64 text_offset
          # field, but the field is a displacement: piano's ABL computes a bad
          # address from it and drops straight back to fastboot. The shim now
          # writes 0, which the pinned bootimg.py rejects; accept either.
          git -C UniXNU apply "$PWD/device/patches/unixnu-bootimg-text-offset.patch"
          grep -n 'text_offset not in' UniXNU/scripts/unixnu/bootimg.py
          # The board's only working keys are volume up/down (SCAN_LEFT and
          # SCAN_RIGHT) and power (Enter). The menu navigated on SCAN_UP/DOWN
          # only and treated SCAN_RIGHT as "boot", so the volume keys could not
          # move the highlight and the first press booted the first entry.
          git -C UniXNU apply "$PWD/device/patches/unixnu-menu-volume-keys.patch"
          # build-stage7-display.py lists NativeGOPPresenter in its object loop and also adds it
          # through display_object(); the duplicate linked the presenter twice.
          git -C UniXNU apply "$PWD/device/patches/unixnu-stage7-display-once.patch"
          grep -n 'NativeKeyStoreEvents' UniXNU/scripts/build-stage7-display.py | head -2
          grep -n 'SCAN_LEFT' UniXNU/package/UniXNUPkg/Library/UniXNULib/Menu.c
          # The firmware runs at EL2 and DarwinBoot only accepted EL1, then
          # branched straight into the kernel; XNU must start at EL1. The loader
          # now takes EL2 too and switches down (HCR_EL2.RW, SPSR_EL2/ELR_EL2).
          git -C UniXNU submodule update --init --depth 1 drivers/DarwinBoot
          git -C UniXNU/drivers/DarwinBoot apply "$PWD/device/patches/darwinboot-el1.patch"
          git -C UniXNU/drivers/DarwinBoot apply "$PWD/device/patches/darwinboot-gop.patch"
          grep -n "video from handle" UniXNU/drivers/DarwinBoot/DarwinBootPkg/Driver/DarwinBoot.c
          grep -n 'EL2' UniXNU/drivers/DarwinBoot/DarwinBootPkg/Driver/Entry.S
          # A 160 MiB FAT32 volume with 2 KiB clusters answers
          # EFI_VOLUME_CORRUPTED when EnhancedFatDxe reads the 125 MB kernel.
          # 8 sectors per cluster makes mtools write FAT16, which reads back.
          git -C UniXNU apply "$PWD/device/patches/unixnu-payload-fat16.patch"
          grep -n "'-c', '8'" UniXNU/scripts/unixnu/payload.py
          # piano has no serial console: make the menu state whether the payload
          # volume was published at all, so the next boot is diagnosable from the
          # screen alone.
          python3 device/scripts/prepare-unixnu-diagnostics.py UniXNU/package/UniXNUPkg/Library/UniXNULib/Config.c
          grep -n 'payload volume missing' UniXNU/package/UniXNUPkg/Library/UniXNULib/Config.c
          mkdir -p device/package device/scripts
          wc -c device/package/PaganiPeripherals.h
          find device/modules -name 'build-*.py' -exec cp -v {} device/scripts/ \; 2>/dev/null || true
          ls -l device/package/ device/scripts/ | head
      - name: defconfig
        working-directory: UniXNU
        run: |
          cat > unixnu.local.toml <<EOF
          [build]
          device = "../device"
          jobs = ${{ inputs.jobs || '4' }}
          target = "DEBUG"
          EOF
          ./unixnu defconfig piano_defconfig -D ../device > /tmp/s1.log 2>&1 || { tail -30 /tmp/s1.log | sed 's/^/::error::/'; exit 1; }
          tail -20 /tmp/s1.log
      - name: fetch
        working-directory: UniXNU
        run: |
          ./unixnu fetch > /tmp/s2.log 2>&1 || { tail -40 /tmp/s2.log | sed 's/^/::error::/'; exit 1; }
          tail -25 /tmp/s2.log
      - name: ipsw
        working-directory: UniXNU
        run: |
          ./unixnu ipsw fetch -D ../device > /tmp/s3.log 2>&1 || { tail -40 /tmp/s3.log | sed 's/^/::error::/'; exit 1; }
          tail -20 /tmp/s3.log
      - name: tree
        working-directory: UniXNU
        run: |
          ./unixnu tree -D ../device > /tmp/s4.log 2>&1 || { tail -40 /tmp/s4.log | sed 's/^/::error::/'; exit 1; }
          find out -maxdepth 4 -type d -name tree
      - name: ufs clocks
        working-directory: UniXNU
        run: |
          # ShengUfs declares SM8550 clocks as a board dependency and keeps the
          # GCC offsets in GccUfs.h; eight of them move on SM8750, and two swap
          # roles with a neighbour, so a copy-paste port enables the wrong
          # clocks. NativeUfs.cpp reads them by name, so this is the whole port.
          # The tree links each driver directory; Python 3.13 rglob does not
          # descend into those symlinks, so patch the module source the tree
          # resolves to and report each script's own failure line.
          UFS=../device/modules/Piano
          ufs() {
            name=$1; shift
            if python3 "$@" > "/tmp/ufs-$name.log" 2>&1; then
              :
            else
              rc=$?
              echo "::error::ufs clocks: $name failed rc=$rc"
              tail -15 "/tmp/ufs-$name.log" | sed 's/^/::error::/'
              exit 1
            fi
          }
          ufs gcc ../device/scripts/prepare-shengufs-gcc.py "$UFS"
          # NativeUfs ships GccUfs.h as a bare include of <Sm8750Platform/GccUfs.h>,
          # so only the platform kit copy carries the offsets; require one such copy
          # instead of every file matching.
          gate=0
          for h in $(find -L out "$UFS" -name GccUfs.h); do
            if grep -n 'GCC_UFS_PHY_AHB_ENABLE\|GCC_UFS_PHY_TX_SYMBOL0_ENABLE\|GCC_UFS_PHY_RX_SYMBOL0_ENABLE' "$h" | head -3; then
              gate=$((gate + 1))
            fi
          done
          test "$gate" -ge 1 || { echo 'no GccUfs.h carries the SM8750 UFS gate offsets'; exit 1; }
          # Use upstream's SM8750 planner (0x100000 window, SM8750 usable rule)
          # instead of the SM8550 copy ShengUfs ships, then adapt the takeover
          # to this board's handoff state.
          ufs smmu-upstream ../device/scripts/prepare-shengufs-smmu-upstream.py "$UFS"
          # Window mode: let the root manifest live in any contiguous block run
          # (native-ufs-window-lba/-blocks), so the iPadOS image can sit in a
          # pinned file inside /data instead of overwriting the partition start.
          ufs root-window ../device/scripts/prepare-shengufs-root-window.py "$UFS"
          # The generic BSD panic names neither the stage nor the manifest fact,
          # so a failed root layout is unreadable on a board without serial.
          # Turn each root failure into a panic that prints both.
          # Do not reset the link from the kernel. The firmware's own UFSDxe
          # already brought it up: the memory log shows 'Successfully Enabled
          # UFS Cache Coherency' and then UFSDxe.efi installing two DiskIo
          # handles. A DME_RESET here tears that link down and DME_LINKSTARTUP
          # cannot retrain it, which is the panic 'pmc ok=0 gear tx/rx=0/0
          # lanes=0/0'. Adopt the firmware's link, as ShengUfs was written to.
          # python3 ../device/scripts/prepare-shengufs-host-reset.py out
          # Leave the SMMU untouched and send the first command from the firmware's
          # own request list: writing S2CR resets this SoC even in bypass.
          ufs adopt-nosmmu ../device/scripts/prepare-shengufs-adopt-nosmmu.py "$UFS"
          # The queue takeover prints what the controller did with the list base
          # and the run-stop bit; HCE cannot be cycled before it, because
          # hostStopQueue refuses to run when HCE is clear.
          ufs mcq-legacy ../device/scripts/prepare-shengufs-mcq-legacy.py "$UFS"
          ufs queue-print ../device/scripts/prepare-shengufs-queue-print.py "$UFS"
          ufs pmc-reset ../device/scripts/prepare-shengufs-pmc-reset.py "$UFS"
          # The kernel writes its bring-up stage to a fixed RAM page before each UFS
          # step; the firmware patch above reports it on the next boot.
          ufs deathlog ../device/scripts/prepare-shengufs-deathlog.py "$UFS"
          # The device answered this probe: slot=1 bank=82 s2cr=00000052 sctlr=0.
          # Firmware detach left the stream on a translation bank whose SCTLR is
          # clear, so nothing the controller fetches can be translated. Put the
          # stream in real bypass instead: the buffers are physical and reach
          # above 4 GiB, which a stage-2 table this driver does not own cannot map.
          # Firmware already put the stream in bypass; the kernel performs no
          # SMMU store at all and only reads the entry back.
          ufs smmu-readonly ../device/scripts/prepare-shengufs-smmu-readonly.py "$UFS"
          # The device asks for a power mode change (UPMCRS) and the UTP does
          # not process commands until the host completes it.
          ufs power-mode ../device/scripts/prepare-shengufs-power-mode.py "$UFS"
          ufs root-debug ../device/scripts/prepare-shengufs-root-debug.py "$UFS"
          # The firmware powers the UFS PHY down on hand-over: the link arrives
          # at Gear 0 with zero lanes and every command times out. Bring both
          # GDSCs up and carry their values in the panic (this runs after
          # power-mode, whose panic line it extends).
          ufs phy-power ../device/scripts/prepare-shengufs-phy-power.py "$UFS"
          # The device arrives in UFS-PowerDown and every LU answers NOT
          # READY; the START STOP UNIT that wakes it was gated on level 5/9.
          ufs wake-device ../device/scripts/prepare-shengufs-wake-device.py "$UFS"
          for h in $(find -L out "$UFS" -name NativeUfs.cpp); do
            grep -n 'level == 4 || level == 5 || level == 9' "$h" | head -1
          done
          for h in $(find -L out "$UFS" -name NativeUfs.cpp); do
            grep -n 'gdsc=%08x phygdsc=%08x' "$h" | head -1
          done
          found=0
          for h in $(find -L out "$UFS" \( -path '*ShengUfs*' -o -path '*NativeUfs*' \) -name SmmuTakeover.h); do
            found=1
            grep -n 'kUfsSmmuMapBytes = 0x100000' "$h" | head -2
            grep -n 'mask == 0' "$h" | head -2
          done
          test "$found" -eq 1 || { echo 'SmmuTakeover.h not found in the UFS source tree'; exit 1; }
      - name: policies
        working-directory: UniXNU
        run: |
          OUT=out/piano/ipados-17.7.11-21H461/piano
          IPSW="$PWD/out/ipsw/21H461"
          mkdir -p .cache/firmware/target-volumes
          cp "$IPSW/044-76040-038.dmg" "$IPSW/044-76034-038.dmg" .cache/firmware/target-volumes/
          python3 ../device/scripts/prepare-ufs-policies.py --tree "$PWD/$OUT/tree" \
            --inputs "$IPSW" --openssl-prefix "$(brew --prefix openssl@3)" \
            > /tmp/s4b.log 2>&1 || { echo "::error::ipsw fetch failed: $(grep -inE 'error|failed|fatal|undefined symbols|no such file|not found' /tmp/s4b.log | tail -4 | tr -d '%' | tr '\n' ' ' | cut -c1-900)"; tail -40 /tmp/s4b.log | sed 's/^/::notice::/'; exit 1; }
          tail -10 /tmp/s4b.log
      - name: kernel
        working-directory: UniXNU
        run: |
          set +e
          ./unixnu build kernel -D ../device -j ${{ inputs.jobs || '4' }} > /tmp/s5.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            {
              echo '### kernel build failed'
              echo "exit=$rc"
              echo '```'
              tail -120 /tmp/s5.log | tr -d '\r'
              echo '```'
              echo '### error lines'
              echo '```'
              grep -nE 'error:|Error [0-9]|Undefined symbols|undefined reference|No such file|not found|fatal' /tmp/s5.log | tail -40 | tr -d '\r'
              echo '```'
              echo '### log inventory'
              echo '```'
              find out -path '*/logs/*.log' -type f -exec ls -l {} \; 2>/dev/null | awk '{print $5, $9}' | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
            msg=$(grep -nE 'error:|Error [0-9]|Undefined symbols|undefined reference|No such file|not found|fatal' /tmp/s5.log | tail -3 | tr -d '%\r' | tr '\n' '|' | cut -c1-900)
            echo "::error::s5 exit=$rc: $msg"
            exit 1
          fi
          set -e
          if ! python3 ../device/scripts/prepare-xnu-root-auth.py --check out > /tmp/s5b.log 2>&1; then
            echo "::error::root-auth check failed: $(tail -4 /tmp/s5b.log | tr '\n' '|' | cut -c1-900)"
            { echo '### root-auth check failed'; echo '```'; tail -40 /tmp/s5b.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
            exit 1
          fi
          tail -6 /tmp/s5b.log
          found=0
          for f in $(find out -path '*/.cache/xnu-work/*' -name lock_rw.c); do
            found=1
            n=$(grep -o 'panic("Taking non-sleepable RW lock with preemption enabled");' "$f" | wc -l | tr -d ' ')
            d=$(grep -c 'lck_rw_non_sleepable_diagnostic' "$f" | tr -d ' ')
            echo "::notice::$f assertions=$n diagnostics=$d"
            if [ "$n" -ne 5 ] || [ "$d" -ne 6 ]; then
              echo "::error::$f expected 5 assertions and 6 diagnostic references, found $n and $d"
              exit 1
            fi
            if grep -q 'if (0) panic("Taking non-sleepable RW lock' "$f"; then
              echo "::error::$f short-circuits a lock assertion; use patches/xnu/series"
              exit 1
            fi
          done
          test "$found" -eq 1 || { echo '::error::no prepared .cache/xnu-work lock_rw.c under out'; exit 1; }
      - name: package
        working-directory: UniXNU
        run: |
          ./unixnu build package -D ../device > /tmp/s6.log 2>&1 || { echo "::error::package failed: $(grep -inE 'error|failed|fatal|undefined symbols|no such file|not found' /tmp/s6.log | tail -4 | tr -d '%' | tr '\n' ' ' | cut -c1-900)"; tail -40 /tmp/s6.log | sed 's/^/::notice::/'; exit 1; }
          tail -15 /tmp/s6.log
      - name: firmware
        working-directory: UniXNU
        run: |
          ./unixnu build firmware -D ../device --uefi ../uefi/deps/Mu-Silicium > /tmp/s7.log 2>&1 || { echo "::error::firmware failed: $(grep -inE 'error|failed|fatal|undefined symbols|no such file|not found' /tmp/s7.log | tail -4 | tr -d '%' | tr '\n' ' ' | cut -c1-900)"; tail -40 /tmp/s7.log | sed 's/^/::notice::/'; exit 1; }
          tail -15 /tmp/s7.log
      - name: payload
        working-directory: UniXNU
        run: |
          # panic_screen needs Mu-Silicium's FrameBufferSerialPortLib/Font.h.
          ./unixnu build payload -D ../device --uefi ../uefi/deps/Mu-Silicium > /tmp/s8.log 2>&1 || {
            echo "::error::payload failed: $(grep -inE 'error|failed|fatal|undefined symbols|no such file|not found' /tmp/s8.log | tail -4 | tr -d '%' | tr '\n' ' ' | cut -c1-900)"
            for f in out/piano/*/*/logs/payload-patch.log out/piano/*/*/logs/payload-seal.log; do
              [ -f "$f" ] || continue
              echo "::error::$(basename "$f"): $(tail -3 "$f" | tr '\n' '|' | tr -d '%' | cut -c1-900)"
              { echo "### $f"; echo '```'; tail -60 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
            done
            tail -40 /tmp/s8.log | sed 's/^/::notice::/'
            exit 1
          }
          tail -15 /tmp/s8.log
      - name: bootimg
        working-directory: UniXNU
        run: |
          # bootimg packs the UEFI firmware beside the payload, so it needs the
          # Mu-Silicium checkout just like the firmware step, and it takes the
          # hardware device tree as an explicit input: payload already compiled
          # it from [device_tree] into device-tree/hardware.dtb.
          ./unixnu bootimg -D ../device --uefi ../uefi/deps/Mu-Silicium \
            --dtb out/piano/ipados-17.7.11-21H461/piano/device-tree/hardware.dtb \
            --ramdisk none > /tmp/s9.log 2>&1 || { echo "::error::bootimg failed: $(grep -inE 'error|failed|fatal|undefined symbols|no such file|not found' /tmp/s9.log | tail -4 | tr -d '%' | tr '\n' ' ' | cut -c1-900)"; tail -40 /tmp/s9.log | sed 's/^/::notice::/'; exit 1; }
          tail -15 /tmp/s9.log
      - name: collect
        if: always()
        run: |
          mkdir -p out
          find UniXNU/out/piano -type f \( -name '*.img' -o -name 'kernel.macho*' -o -name '*.efi' \) -exec cp -v {} out/ \; || true
          tar czf out/logs.tar.gz UniXNU/out/piano/*/*/logs 2>/dev/null || true
          cat /tmp/s*.log > out/build.log 2>/dev/null || true
          ls -l out
      - name: failure summary
        if: failure()
        run: |
          set +e
          {
            echo '## failure'
            for f in /tmp/s5.log /tmp/s5b.log /tmp/s4b.log /tmp/s4.log; do
              [ -f "$f" ] || continue
              echo "### $f"
              echo '```'
              tail -60 "$f" | tr -d '\r'
              echo '```'
            done
            for f in UniXNU/out/piano/*/*/logs/payload-patch.log UniXNU/out/piano/*/*/logs/payload-seal.log; do
              [ -f "$f" ] || continue
              echo "### $f"
              echo '```'
              tail -60 "$f"
              echo '```'
            done
            echo '### log inventory'
            echo '```'
            find UniXNU/out -path '*/logs/*.log' -type f -exec ls -l {} \; 2>/dev/null | awk '{print $5, $9}' | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piano-ipados-${{ inputs.os || '17' }}
          path: out/
