[[area]]
id = "storage"
status = "implemented"
components = ["ShengUfs", "VirtioMmioBlock", "RamBlock", "VerifiedRoot"]
paths = ["scripts/prepare-ufs-policies.py", "scripts/build-ufs-storage-bindings.py", "scripts/build-virtio-mmio-bindings.py", "scripts/build-verified-root-probe.py", "scripts/prepare-shengufs-*.py", "scripts/prepare-xnu-root-auth.py", "configs/**"]
inputs = ["iPadOS 17.7.11 (21H461) IPSW, the signed verified-root policies from 044-76040-038.dmg and 044-76034-038.dmg, and the original kernelcache as the ABI reference."]
configuration = ["CONFIG_XNU_NATIVE_UFS, CONFIG_XNU_NATIVE_VIRTIO_BLOCK, CONFIG_XNU_NATIVE_RAM_BLOCK and CONFIG_XNU_VERIFIED_ROOT_PROBE.", "CONFIG_XNU_OWNER_ROOT_AUDIT, CONFIG_XNU_OWNER_ROOT_TRUST, CONFIG_XNU_TRUST_CACHE_RUNTIME, CONFIG_XNU_OWNER_CACHE_MOUNT, CONFIG_XNU_OWNER_CACHE_STARTUP, CONFIG_XNU_OWNER_BOOT_MANIFEST and CONFIG_XNU_OWNER_UNION_SYSTEMOS are enabled; the payload supplies root-unverified=1 for the unsigned SHNGROOT window.", "[payload].kernel_args uses native-ufs-root=1, native-ufs-window-lba=55778816 and native-ufs-window-blocks=2290688; [payload.adt].root_match_volume_uuid names APFS volume 04769D26-2CA0-4825-B443-E2E5F88300F2."]
procedure = ["Run ./unixnu ipsw fetch -D ../device to place the IPSW under out/ipsw/21H461.", "Run python3 scripts/prepare-ufs-policies.py --tree <tree> --inputs <ipsw> --openssl-prefix $(brew --prefix openssl@3).", "Run ./unixnu build kernel -D ../device, which builds ShengUfs, VirtioMmioBlock and RamBlock and their bindings against kernelcache.decompressed."]
findings = ["The three storage components share one set of binding objects: 468d1fd put the raw bindings only in libShengUfs.a and let VirtioMmioBlock and RamBlock reuse them, which removed twelve duplicate symbols at link time.", "67ad370 dropped a native_ufs_store_write stub already provided by NativeUfs.o, and 2b1e6ec kept only the weak native_ufs_store_write_cached stub.", "The policies step has to read the DMG files from out/ipsw/21H461, not from the device output directory (e04d7c2).", "The verified-root probe needs -Wno-missing-include-dirs because the probe compiles outside the SDK include set (70c6fc7).", "The binding scripts take the kernelcache as the ABI reference and the PMGR audit reads it from tree/.cache/firmware/kernelcache.macho/, so the candidate step copies it there.", "build-virtio-mmio-bindings.py is no longer a Python file in this repository: the pinned Enc3l component recipe owns the equivalent step, so the local copy was removed and the kernel step no longer carries it.", "scripts/prepare-xnu-root-auth.py is offline-only after this revision: it rewrites all five lock assertions with a negative-lookbehind regex, is idempotent on a second pass, and exits non-zero when the count is not five. CI runs it with --check and never mutates the fetched tree."]
completion = ["The kernel links with the storage archives, the prelink succeeds, and the payload declares the native UFS root.", "On the device the driver brings the controller up from the state the firmware leaves, reads the partition table and the SHNGROOT window, and the APFS volume 04769D26 becomes the mounted root."]
limits = ["The root-auth owner path and second original trust cache are candidate changes; they have not been RAM-booted in this revision.", "The lock assertion is still expected to panic with caller frames if owner-root does not avoid the path; no device result is claimed here.", "Only one CPU is configured until the lock caller is understood."]
next_action = ["Boot the GitHub-produced image over USB and record whether root-unverified reaches the next checkpoint; if lock_rw:1400 fires, retain its printed caller frames.", "Re-test cpus=8 only after the single-CPU owner-root path is understood."]
