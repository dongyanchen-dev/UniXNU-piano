schema_version = 1

[device]
name = "piano"
soc = "SM8750"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Pad 8 Pro (piano, SM8750) boots iPadOS 17.7.11 from RAM through a Mu-Silicium based UEFI. Verified on the device: the UFS driver reads the disk (GPT, INQUIRY, 4096-byte blocks), the SHNGROOT window mounts, and the APFS volume 04769D26 becomes the root. Not verified: the owner-root route and every step after mounting; the last device boot stopped at the first DEBUG_LOCKS assertion, lock_rw.c:1400, after the mount. No partition is written."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmCpu", "ArmDTPlatform", "DarwinBoot", "XnuPrelink", "RamBlock", "VirtioMmioBlock", "SoftwareAES", "AppleKeyStoreState", "ShengUfs", "GopFramebuffer", "VerifiedRoot", "PaganiInput", "PaganiPanel", "Stage7Probe", "NativeMobileDisplay", "Adreno830", "BootProgress", "NativeKeyStoreEvents", "QcomGeniSpi", "Sm8750Platform", "NativePrelink", "AdrenoPM4", "ArmSmmu4K", "ShengPlatformPower", "AdrenoFirmware", "AdrenoMetal"]
paths = ["board.toml", "feeds.toml", "configs/**", ".gitmodules", ".gitattributes", "modules/*", ".github/**", ".gitignore", "porting.toml", "README.md"]
inputs = ["SM8750 SoC support from the OnePlus 13T port (UniXNU-sm8750-common), an iPadOS 17.7.11 (21H461) IPSW, and a UniXNU checkout pinned by the packaging workflow."]
configuration = ["board.soc_source = sm8750; board.os_profile = ipados-17.7.11-21H461; board.kit = oneplus13t (the reference layout; build-stage7-display.py reads kits/oneplus13t/PaganiPeripherals.h); schema_version = 2.", "piano_defconfig enables owner-root audit/trust/cache paths, native UFS/AES/ram/virtio storage, native legacy display and native Adreno archives; the bootstrap defconfig keeps the same link surface with ShengPlatformPower disabled.", "feeds.toml registers the local Piano sources (PaganiInput, PaganiPanel, Stage7Probe, NativeMobileDisplay, Adreno830, ShengPlatformPower, BootProgress, NativeKeyStoreEvents and the NativePrelink kit) under modules/Piano; board.toml selects them and lists their archives. AdrenoMetal is selected as a source for Adreno830's OriginalAcceleratorABI.h but is not in [kernel].archives; it stays a payload-only component.", "[payload] uses root-unverified=1 and the verified 55778816..58069503 iPadOS window. [bootimg] leaves embed_payload off because the pinned piano UEFI branch has no PianoPayloadDxe; the payload remains a USB staging artifact even though the pinned Enc3l bootimg.py implements the key."]
procedure = ["Run ./unixnu defconfig piano_defconfig -D ../device from the UniXNU checkout.", "Run ./unixnu fetch, ./unixnu ipsw fetch -D ../device and ./unixnu tree -D ../device.", "Trigger .github/workflows/package-bare-metal.yml with os=17 and jobs=4."]
findings = ["The previous RELEASE experiment was invalid: unixnu target selects firmware/package paths, while the XNU build is fixed to KERNEL_CONFIGS=DEVELOPMENT; lock_rw.c:1400 is outside DEBUG_RW and target changes do not remove it.", "The device-verified baseline reads UFS/GPT/SHNGROOT and mounts APFS volume 04769D26, then stops at lock_rw.c:1400. The lock assertion is kept fatal in the candidate path so its caller can be observed.", "Root authentication is now a formal patches/xnu/series change: zzz-root-unverified.patch accepts root-unverified=1 while retaining autherr and owner_authorized control flow; the old runtime bsd_init rewrite is removed.", "The kernel step self-check now requires the diagnostic helper definition plus five call sites and rejects any 'if (0) panic' short-circuit, so a green kernel step can no longer mean the assertion was removed.", "The new .gitattributes forces *.patch to LF in every checkout, because a CRLF patch applied on Windows but failed with 'patch does not apply' on the macOS runner. A kernel failure annotation now prints the tail of out/**/logs/kernel-bootstrap.log, kernel.log, and the last-modified build log. Run 45245406335 exposed why the last one matters: the bootstrap link is expected to fail and is tolerated, so its log was not the failing one; the first component builder (ArmDTPlatform) failed after it. The Enc3l recipe redirects the bootstrap make output there, so run 45237114258 showed only three generic make lines and no compiler error.", "The local Piano driver sources are pinned as git submodules and registered in feeds.toml; their effective inclusion still requires a successful GitHub build. Run 45249812348 failed because Adreno830's recipe needs drivers/AdrenoMetal/OriginalAcceleratorABI.h; AdrenoMetal is now selected for its source tree only.", "modules/Piano and modules/ArmSmmu4K are not recorded as gitlinks: the workflow clones both at their pinned commits, so adding or removing modules/* changes only the build inputs.", "The official UniXNU main has no embed_payload consumer, but the build does not use it: Enc3l a6ff776 implements [bootimg].embed_payload in scripts/unixnu/bootimg.py:105. Embedding is still off because the pinned piano UEFI branch 31545f9 has no PianoPayloadDxe; UEFI main 5b0ddb7 does. Moving the pin requires re-validating the four UEFI patches first."]
completion = ["All source pins resolve, every selected component is covered by an area, and the two-pass kernel build links with the sheng PMGR archive force-loaded."]
limits = ["The UniXNU revision is pinned in the workflow; the effective component set is only visible through ./unixnu status.", "The boot image no longer carries the payload, so a boot needs the host to stage payload.img inside the boot manager's wait window."]
next_action = ["Run the GitHub kernel/package/firmware/payload workflow with the new feed and patch series; inspect unixnu status --json in the job.", "Only after the image builds, RAM-boot it and record whether root-unverified gets past bsd_init and which lock_rw caller frames print."]
evidence = [
  { kind = "source", reference = "patches/xnu/zzz-root-unverified.patch", result = "formal root-unverified=1 owner-authorized path; autherr panic remains the final guard" },
  { kind = "source", reference = "patches/xnu/zz-lock-rw-diagnostics.patch", result = "all five non-sleepable RW assertions emit an eight-frame backtrace in a diagnostic panic" },
  { kind = "source", reference = ".github/workflows/package-bare-metal.yml", result = "no separate candidate bootstrap pass (the pinned Enc3l kernel.py does its own bootstrap), local feeds for ShengPlatformPower/BootProgress/NativeKeyStoreEvents/NativePrelink, the ArmSmmu4K pin e923329e (capacity_pages arena) and patches/unixnu-stage7-display-once.patch; the prep step also applies patches/uefi/piano-dsc-unixnulib.patch and patches/uefi/piano-fastboot-payload.patch, patches/uefi/bootshim-image-size.patch and patches/uefi/mu-sec-entry-arg.patch (the last two against uefi/deps/Mu-Silicium, because that checkout and its BootShim and SEC sources only exist after tools/setup-deps.sh), and patches/unixnu-bootimg-text-offset.patch and patches/unixnu-menu-volume-keys.patch against the pinned UniXNU checkout (the first also carries the USB bring-up trace and the payload channel), and runs scripts/prepare-unixnu-diagnostics.py on its UniXNULib/Config.c, and runs scripts/prepare-shengufs-gcc.py on its out directory after the tree step" },
  { kind = "source", reference = ".github/workflows/package-bare-metal.yml", result = "the bootimg step passes --ramdisk none, so the run reports 'ramdisk: empty' and a 3162112-byte boot.img while the 160 MiB payload.img stays a separate artifact" },
  { kind = "source", reference = "scripts/prepare-shengufs-gcc.py", result = "rewrites GCC_UFS_PHY_AHB_ENABLE 0x77024 to 0x77028, TX_SYMBOL0 0x77028 to 0x7702c and RX_SYMBOL0 0x7702c to 0x77030 (two of these swap roles with a neighbour), plus UNIPRO_CORE 0x7706c, ICE_CORE 0x7707c, PHY_AUX 0x770bc, RX_SYMBOL1 0x770d8 and AGGRE_AXI 0x770f0; it fails when no GccUfs.h exists and is idempotent" },
  { kind = "source", reference = "patches/unixnu-menu-volume-keys.patch", result = "Menu.c accepts SCAN_LEFT as up and SCAN_RIGHT as down, and SCAN_RIGHT no longer boots the selected entry" },
  { kind = "device", reference = "reports/uefi-boot-42968500580.md", command = "fastboot boot boot.img; fastboot stage payload.img; fastboot oem ramdisk; then volume up/down and power on the UniXNU menu", revision = "f37b9f3866df66105c93483df2551e528b61836a", result = "Menu.c accepts SCAN_LEFT as up and SCAN_RIGHT as down; volume up/down move the highlight and power confirms (operator-confirmed on the device). The USB payload path reaches the boot manager: staging the 160 MiB payload.img takes 1.370 s, so the FbPoll pump works, but 'fastboot oem ramdisk' answers 'cannot publish the payload' because PublishVolume copied the buffer with a 160 MiB AllocatePool that returned out of resources. Reverted to aliasing the staged buffer in c75b22e; not yet re-tested." },
  { kind = "source", reference = "configs/piano_bootstrap_defconfig", result = "bootstrap selection: identical to piano_defconfig except CONFIG_XNU_SHENG_PMGR; native legacy display and Adreno symbols are supplied by the local Piano feeds" },
  { kind = "source", reference = "board.toml", result = "board identity, component selection, [kernel].archives and [package].unixnu the packaging workflow consumes" },
]

[[area]]
id = "firmware"
status = "implemented"
components = []
paths = ["proprietary-files.txt", "patches/uefi/**"]
inputs = ["Mu-Silicium based UEFI for SM8750, spliced through tools/setup-deps.sh, plus the board UEFI repository pinned by the workflow."]
configuration = ["[firmware] config = piano, dsc = Platforms/Xiaomi/pianoPkg/piano.dsc, fd = Build/pianoPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd.", "[firmware].packages lists the UEFI root, {tree}/package, {tree}/kits, {tree}/drivers/DarwinBoot and the EDK II/Mu trees.", "[firmware.defines] UNIXNU = 1 and DEVICE_MODEL = piano."]
procedure = ["Run uefi/tools/setup-deps.sh in the UEFI checkout.", "Apply patches/uefi/piano-dsc-unixnulib.patch at the repository root.", "Run ./unixnu build firmware -D ../device --uefi ../uefi/deps/Mu-Silicium."]
findings = ["The firmware volume failed with error 4000 ('Instance of library class [UniXNULib] is not found for module ... UniXNU.inf') because pianoPkg/piano.dsc had no LibraryClasses mapping for UniXNULib; the patch adds it.", "ENABLE_SECUREBOOT defined empty made '#if ENABLE_SECUREBOOT == 1' an invalid token; the DSC now defines it as 0.", "The firmware packages list needs drivers/DarwinBoot rather than the older PaganiDarwinBoot path.", "The payload cannot travel in the boot image: a vendor ABL refuses the 160 MiB ramdisk (oem debuglog shows UNIXNURAMDISK publishing the stale 38.9 MB Android initrd the device tree still names), and vendor_boot is only 96 MiB, so neither field fits a 125 MB kernel. The fastboot path carries it instead: FB_MAX_DOWNLOAD rises to 256 MiB, 'oem ramdisk' publishes the staged bytes as a read-only BlockIo volume for the FAT driver, and DeviceBootManagerAfterConsole waits up to 180 s for that volume before UniXNU scans the volumes once (twenty seconds raced the host's re-enumeration: the firmware drops off the bus shortly after the menu is drawn, so every attempt lost the enumeration and nothing was ever staged). The patch also keeps the fastboot bring-up trace: the UsbDevice protocol and StartEx results are printed and held, and both are retried (10 x 200 ms and 5 x 300 ms). PmicDxe stays disabled: its SPMI channel 690 access faults because ABL no longer grants that channel to the apps execution environment, and the fault is what the vendor comment records. UFS still enumerates, so the protocols the storage path needs are provided by the unconditionally loaded charger and platform drivers; a StartEx failure would point at the rails rather than at a missing protocol.", "The stock boot manager never started UniXNU.efi: DeviceBootManagerAfterConsole ran PianoDtbInstall, PianoFastbootStart, StartEspLoader and StartFvApp(AndroidBoot), so the menu built into the firmware volume was unreachable. The first patch added a StartFvApp call with UniXNU's FILE_GUID; the board then booted UEFI all the way to the console and dropped into the UEFI Shell instead of the menu, because StartFvApp built its device path from DevicePathFromHandle(LoadedImage->DeviceHandle), which inside BDS does not carry a usable firmware volume path, so EfiBootManagerBoot failed silently. StartFvApp now reads the PE32 section with GetSectionFromAnyFv and calls LoadImage/StartImage itself, and prints each outcome on the console so the next boot states whether the image is in a volume, failed to load, or returned.", "The payload volume publishes on the device: build 43001198573 (28ab843) answers 'fastboot oem ramdisk' with OKAY in 11 ms after 'stage' moves 160 MiB in 3.918 s, and the UniXNU menu then offers the xnu entry (reports/uefi-boot-43001198573.md). The earlier 'cannot publish the payload' was the duplicated A9C6827C device path, not the transfer buffer: with 3E7B9C41 and no 160 MiB copy the install succeeds. The memory log is not retrievable in that session - oem debuglog plus get_staged return 0 bytes, because the firmware stops servicing the fastboot endpoint once UniXNU takes the console.", "The fastboot poll timer is re-armed after the payload window. PianoFastbootWaitPayload cancels the 5 ms FbPoll timer so it can pump the endpoint by hand, and only restored it on the no-payload path: once the payload arrived the firmware still answered 'oem ramdisk' but ignored 'oem debuglog', which is why the 43001198573 run produced a 0-byte memory log right after a successful publish. Both paths re-arm now, so UniXNU's DEBUG lines stay reachable after the menu appears - the only channel this board has, since it has no serial port and the XNU display path is not up yet.", "The fastboot poll timer is re-armed after the payload window, so the memory log stays reachable once UniXNU owns the console: the 43021581743 run returned 174,337 bytes of debuglog after 'oem ramdisk' answered OKAY, where the earlier build returned 0.", "The 160 MiB FAT32 payload (2 KiB clusters) could not be read back on the device: UniXNU loaded unixnu.toml from it, but the XNU entry returned EFI_VOLUME_CORRUPTED right after opening Payloads/kernel.macho, and DarwinBoot surfaced that as 'Volume Corrupt'. Rebuilding the same three files into a 4 KiB-cluster FAT16 volume (40,915 clusters) moved the failure to the next guard, so the read succeeded; the payload step now writes FAT16 by dropping mformat's -F and asking for -c 8.", "DarwinBoot then refused the handoff with EFI_UNSUPPORTED. Its Boot() guard rejects staged kexts, a passed-in device tree, or a current exception level other than EL1; the device log shows 0 staged kexts and the entry carries no dtb (UniXNUPrepareDeviceTree returns early when Entry->Dtb is NULL), so the exception level is what fired: Mu-Silicium's SEC configures HCR_EL2 and stays at EL2, while XNU must start at EL1. DarwinBoot now accepts EL2 and switches to EL1 (HCR_EL2.RW=1, SPSR_EL2=EL1h|DAIF, ELR_EL2=entry, eret) immediately before entering the kernel, instead of the previous 'br x1' at EL2.", "The DarwinBoot patch needs its submodule first: UniXNU is checked out without submodules, so drivers/DarwinBoot is empty at prep time and the patch step must run 'git -C UniXNU submodule update --init --depth 1 drivers/DarwinBoot' beforehand.", "The package workflow takes a 'runner' workflow_dispatch input (macos-26 default, macos-15 as a fallback) because macos-26 is a limited-preview image and a dispatch can sit queued for an hour; the job's runs-on reads that input so a stuck queue is bypassed by re-dispatching with macos-15.", "DarwinBoot now DEBUG-prints the boot request inputs (kext count, device tree pointer and size, raw CurrentEL) before its guard, because the device still returns Unsupported with the EL2 acceptance applied and every other disjunct is false in the configuration.", "The UniXNU screen surface is PixelRedGreenBlueReserved8BitPerColor on this board; keeping only the BGR case made DarwinBootVideoFromGop return EFI_UNSUPPORTED, which the menu reports as the xnu entry failing. Both orders are accepted and the buffer is passed through unchanged.", "The panel reports EFI_PIXEL_BIT_MASK, not one of the fixed 8-bit orders: DarwinBoot now logs the GOP format and its channel masks and accepts any 32-bit order, because rejecting the mode surfaces as the whole xnu entry returning Unsupported.", "The panel reports EFI_PIXEL_BIT_MASK rather than one of the fixed 8-bit orders: DarwinBoot now logs the GOP format with its channel masks and accepts any 32-bit order, because refusing the mode surfaces as the whole xnu entry returning Unsupported.", "A failing Boot() returns to UniXNU and the menu prints that status, which reads as 'entry 0 returned Unsupported'; Boot() only Print()s its cause, so the reason never reaches the memory log. DarwinBoot links DebugLib, so every guard and the Fail label need DEBUG lines.", "native-ufs-probe=7 is the read-only SMMU probe: it panics with scr0/idr0/idr1/gfsr, the SMR table summary and the SID 0x60 match, so the geometry the ShengUfs planner rejects can be read off the device without writing any SMMU register."]
completion = ["The firmware step emits SILICIUM_UEFI.fd for pianoPkg with the UniXNU application linked in."]
limits = ["The firmware boots and publishes the payload, but no XNU boot has been captured: the memory log is empty in every session that reaches the menu, so a failure after the menu would show only on the screen."]
next_action = ["Capture the XNU verbose output from the menu (screen or pstore): publish, menu and input are confirmed, the kernel handoff is not."]
evidence = [
  { kind = "source", reference = "patches/uefi/piano-fastboot-payload.patch", result = "reports the USB device protocol lookup and StartEx result on the console, each held for two seconds, so the piano-uefi fastboot bring-up can be diagnosed without a serial port" },
  { kind = "source", reference = "patches/uefi/piano-fastboot-payload.patch", result = "starts UniXNU.efi from the firmware volume before the ESP loader and AndroidBoot fallbacks (loading it with GetSectionFromAnyFv plus LoadImage/StartImage rather than a device path built from the BDS loaded image), and carries the payload over USB instead of the boot image ramdisk: FB_MAX_DOWNLOAD rises to 256 MiB, oem ramdisk publishes the staged bytes as a read-only BlockIo volume, and the boot manager waits up to 180 s for it before UniXNU scans the volumes, because the firmware leaves the USB bus shortly after the menu is drawn and a twenty-second window raced the host's re-enumeration" },
  { kind = "source", reference = "patches/uefi/piano-fastboot-payload.patch", result = "PianoFastbootWaitPayload raises the payload window from 20 s to 180 s (commit 28ab843): the host has to see the re-enumerated piano-uefi device, stage 160 MiB and publish it, and the firmware leaves the USB bus shortly after the menu appears, so the shorter window lost the race on every attempt. The wait pumps FbPoll by hand with the periodic timer cancelled, because gBS->Stall is a metronome busy wait that dispatches no event notify" },
  { kind = "device", reference = "reports/uefi-boot-43001198573.md", command = "fastboot boot boot-43001198573.img; fastboot stage payload-43001198573.img; fastboot oem ramdisk; then select the xnu entry on the UniXNU menu", revision = "28ab8431b5c77ff7a20e20b5f85f88afc3be2cb6", result = "oem ramdisk answers OKAY [0.011s] after stage moves 160 MiB in 3.918s, and the menu offers the xnu entry (operator-confirmed bootable). The payload volume therefore mounts: the 3E7B9C41 device path and the staged-buffer aliasing fixed the EFI_ALREADY_STARTED failure. oem debuglog plus get_staged return 0 bytes because the firmware stops servicing the fastboot endpoint once UniXNU takes the console" },
  { kind = "source", reference = "patches/uefi/piano-fastboot-payload.patch", result = "PianoFastbootWaitPayload re-arms the periodic FbPoll timer in both outcomes instead of only when no payload arrives, so 'oem debuglog' and 'get_staged' keep working after the payload volume is published and the UniXNU menu owns the console" },
  { kind = "device", reference = "reports/uefi-boot-43021581743.md", command = "fastboot boot boot-43021581743.img; fastboot stage payload-43021581743.img; fastboot oem ramdisk; fastboot oem debuglog; fastboot get_staged uefi.log", revision = "b0dcac2791caa8e3f20130f55e0c60fd14b3a478", result = "Payload volume publishes and the memory log is retrievable after the menu (174,337 bytes). With the CI-built FAT32 payload the XNU entry returns Volume Corrupt after opening kernel.macho; with a locally rebuilt FAT16 payload the same entry returns Unsupported, which is DarwinBoot's inputs/exception-level guard (0 kexts, no device tree, so EL2 against a loader that only accepted EL1)." },
  { kind = "source", reference = "patches/darwinboot-el1.patch", result = "DarwinBoot accepts EL2 in the Boot() guard and switches to EL1 before entering the kernel (HCR_EL2.RW, SPSR_EL2=EL1h|DAIF, ELR_EL2=entry, eret); applied to the pinned 3c75734 tree" },
  { kind = "source", reference = "patches/unixnu-payload-fat16.patch", result = "Payload volume is written as FAT16 with 8 sectors per cluster instead of forced FAT32, because EnhancedFatDxe cannot read the 125 MB kernel back out of the FAT32 volume" },
  { kind = "source", reference = "patches/uefi/piano-dsc-unixnulib.patch", result = "adds the UniXNULib LibraryClasses mapping that fixes the error 4000 firmware build failure" },
  { kind = "source", reference = "patches/uefi/piano-fastboot-payload.patch", result = "PublishVolume must alias the staged transfer buffer and publish on a device path of its own. The device run showed 'fastboot: publish mData=C8433000 size=0xA000000 ready=0' followed by 'fastboot: publish failed Already started': InstallMultipleProtocolInterfaces answers EFI_ALREADY_STARTED when the device path is already in the handle database, and UniXNURamDiskDxe had installed the same A9C6827C-1BD8-410C-885A-C46500F7D836 node while publishing the stale Android initrd. The volume now uses 3E7B9C41-8D52-4A6F-B1C7-2A5E9D4308BF. The copy added earlier is also gone: a 160 MiB AllocatePool returns out of resources. Status lines use DEBUG (), because Print () reaches ConOut only and never the memory log" },
]

