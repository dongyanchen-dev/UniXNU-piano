schema_version = 2

[board]
name = "piano"
soc = "SM8750"
soc_source = "sm8750"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Pad 8 Pro: first XNU boot from RAM (OnePlus 13T base)"
kit = "oneplus13t"

[ipsw]
fetch = ["AppleLogo", "KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache", "OS", "Cryptex1,SystemOS"]

[ipsw.sha256]
"applelogo@2732~ipad.im4p" = "de55e7b7a4eff459118f8a4ec9af79b017cfdbfec4c5b079346e414c68ff1fba"

[components]
include = ["ArmCpu", "ArmDTPlatform", "DarwinBoot", "XnuPrelink", "NativeRamBlock", "NativeVirtioBlock", "SoftwareAES", "AppleKeyStoreState", "NativeUfs", "GopFramebuffer", "PaganiVerifiedRoot", "ShengPlatformPower", "PaganiInput", "PaganiPanel", "Stage7Probe", "NativeMobileDisplay", "Adreno830", "AdrenoMetal", "AdrenoFirmware", "PaganiDarwinBoot", "QcomGeniSpi"]

[kernel]
config_fragments = ["arch:configs/common.config", "soc:configs/sm8750.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
defconfig = "piano_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-libpthread-kernel.py",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "component:NativeUfs",
  # The binder writes NativeUfs' qualified original storage bindings; the
  # transport and RAM aliases reuse it instead of rebinding the same class.
  "build-ufs-storage-bindings.py --kernelcache ../../../../ipsw/21H461/kernelcache.decompressed",
  "component:NativeVirtioBlock",
  "component:NativeRamBlock",
  "build-pagani-verified-root-probe.py --component os --include-systemos",
  "component:ShengPlatformPower",
  "component:GopFramebuffer",
  "component:AppleKeyStoreState",
  # Local Piano/Pagani drivers registered in feeds.toml.
  "component:Stage7Probe",
  "component:NativeMobileDisplay",
  "build-boot-progress.py",
  "component:PaganiInput",
  "component:PaganiPanel",
  "component:Adreno830",
  "build-piano-gpu.py --no-firmware"
]

[kernel.prelink]
tool = "kits/XnuPrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.iokit.IOStorageFamily", "com.apple.filesystems.apfs",
  "com.apple.driver.AppleMobileFileIntegrity", "com.apple.kext.CoreTrust",
  "com.apple.security.sandbox", "com.apple.driver.ApplePMGR",
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.iokit.IOSurface", "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOHIDFamily", "com.apple.iokit.IOHIDEventDriver",
]

[payload]
skip_setup_tool = "scripts/seed-data-skip-setup.py"
skip_setup_args = ["--no-auto-dim"]
volume = "UNIXNUPIANO"
size_mib = 160
loader = "firmware"
panic_screen = true
title = "Xiaomi Pad 8 Pro: XNU first boot"
dram_size = "0x180000000"
timeout = 600
kernel_args = ["-v", "serial=0", "debug=0x14e", "cpus=1", "kt_fixed_zones=240", "sheng-pmgr=2", "-no_corpses", "offline-legacy-gop=1", "pagani-platform-status=1", "native-legacy-display=1", "native-adreno=1", "native-ufs-root=1", "native-ufs-window-lba=55778816", "native-ufs-window-blocks=2290688", "root-unverified=1", "disable-watchdogd=1", "log=1"]
trust_cache_sha256 = ["7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7", "b00fe9d2ab01cf62690d44a24bf0febc136b97574ce7e4e854a8c02afd8893cf"]

[payload.adt]
ipad_identity = true
unique_chip_id = "required"
chip_id = "0x8011"
packed_data_ramdisk = true
owned_memory_size = "0x100000000"
# APFS volume of 044-76040-038.dmg in the iPadOS 17.7.11 (21H461) IPSW.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"

[bootimg]
# RAM-only boot: boot.img contains UEFI + DTB. The 160 MiB payload is staged
# over USB by the current Piano firmware; no unixnu partition is read or written.
# The live storage reader uses [payload] native-ufs-window-lba/blocks below.

[bootimg.image]
kernel_compression = "none"

[userdata]
# GPT entry 35, the read-only iPadOS window used by ShengUfs. These are device
# facts, not a partition to flash: RAM boot only reads this range.
partition = "ipados"
first_lba = 55778816
last_lba = 58069503
lba_bytes = 4096
[firmware]
# The board UEFI (Mu-Silicium based, after its tools/setup-deps.sh):
# --uefi points at its deps/Mu-Silicium.
config = "piano"
dsc = "Platforms/Xiaomi/pianoPkg/piano.dsc"
fd = "Build/pianoPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/kits",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
]

[firmware.defines]
DEVICE_MODEL = "piano"
UNIXNU = "1"

[device_tree]
source = "device:dts/piano.dts"
include_dirs = ["soc:dts"]

[adt.chosen.u32]
display-scale = 2
display-rotation = 0

[adt.defaults.u32]
sleep-disabled = 1

[adt.product.string]
model = "piano"

[adt.product.u32]
thin-bezel = 0

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

[package]
# The UniXNU checkout, relative to this repository (scripts/package.sh reads it).
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "piano_defconfig"

